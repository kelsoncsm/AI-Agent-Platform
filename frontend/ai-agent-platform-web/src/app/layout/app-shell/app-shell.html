<div class="app-shell">
  <app-sidebar [open]="mobileNavOpen()" (linkClicked)="closeMobileNav()" />

  @if (mobileNavOpen()) {
    <button type="button" class="app-shell__backdrop" aria-label="Fechar menu" (click)="closeMobileNav()"></button>
  }

  <div class="app-shell__main">
    <app-topbar (menuToggle)="toggleMobileNav()" />
    <main class="app-shell__content">
      <router-outlet />
    </main>
  </div>
</div>
