<div class="login">
  <div class="login__card card">
    <div class="login__brand">
      <span class="login__logo" aria-hidden="true">AI</span>
    </div>
    <h1>AI Agent Platform</h1>
    <p>Entre na sua conta para continuar</p>

    <form class="login__form">
      <div class="form-field">
        <label for="email">E-mail</label>
        <input id="email" type="email" class="input" placeholder="seu@email.com" autocomplete="email" />
      </div>

      <div class="form-field">
        <div class="login__label-row">
          <label for="password">Senha</label>
          <a href="javascript:void(0)" class="login__link">Esqueceu a senha?</a>
        </div>
        <input id="password" type="password" class="input" placeholder="••••••••••" autocomplete="current-password" />
      </div>

      <button type="button" class="btn-primary login__submit" routerLink="/dashboard">Entrar</button>
    </form>

    <div class="login__separator"><span>ou continue com</span></div>

    <div class="login__oauth">
      <button type="button" class="btn-secondary">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="#4285F4" d="M23.49 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.77-2.41 3.62v3h3.9c2.28-2.1 3.53-5.2 3.53-8.81z" />
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.92l-3.9-3c-1.08.73-2.47 1.16-4.05 1.16-3.11 0-5.75-2.1-6.69-4.93H1.28v3.09C3.26 21.3 7.31 24 12 24z" />
          <path fill="#FBBC05" d="M5.31 14.31A7.2 7.2 0 0 1 4.9 12c0-.8.14-1.58.4-2.31V6.6H1.28A11.98 11.98 0 0 0 0 12c0 1.93.46 3.76 1.28 5.4l4.03-3.09z" />
          <path fill="#EA4335" d="M12 4.76c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.2 15.24 0 12 0 7.31 0 3.26 2.7 1.28 6.6l4.03 3.09C6.25 6.86 8.89 4.76 12 4.76z" />
        </svg>
        Google
      </button>
      <button type="button" class="btn-secondary">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <rect x="1" y="1" width="10" height="10" fill="#F25022" />
          <rect x="13" y="1" width="10" height="10" fill="#7FBA00" />
          <rect x="1" y="13" width="10" height="10" fill="#00A4EF" />
          <rect x="13" y="13" width="10" height="10" fill="#FFB900" />
        </svg>
        Microsoft
      </button>
    </div>

    <p class="login__footer">Não tem uma conta? <a href="javascript:void(0)" class="login__link">Criar conta</a></p>
  </div>
</div>
